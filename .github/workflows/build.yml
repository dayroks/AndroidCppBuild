name: Build Android SO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        
    - name: Create Makefiles and Build
      run: |
        mkdir -p jni
        cp native-lib.cpp jni/
        
        # Створюємо Android.mk
        echo "LOCAL_PATH := \$(call my-dir)" > jni/Android.mk
        echo "include \$(CLEAR_VARS)" >> jni/Android.mk
        echo "LOCAL_MODULE    := native-lib" >> jni/Android.mk
        echo "LOCAL_SRC_FILES := native-lib.cpp" >> jni/Android.mk
        echo "include \$(BUILD_SHARED_LIBRARY)" >> jni/Android.mk
        
        # Створюємо Application.mk
        echo "APP_ABI := arm64-v8a" > jni/Application.mk
        echo "APP_STL := c++_static" >> jni/Application.mk
        
        # Запускаємо збірку
        \$ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk

    - name: Upload SO
      uses: actions/upload-artifact@v4
      with:
        name: libnative-lib
        path: libs/arm64-v8a/libnative-lib.so
