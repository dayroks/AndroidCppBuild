name: Build C++ SO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
    - name: Compile directly with Clang
      run: |
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ \
          -shared -o libnative-lib.so native-lib.cpp -static-libstdc++
        mkdir -p libs/arm64-v8a
        mv libnative-lib.so libs/arm64-v8a/
    - name: Upload SO
      uses: actions/upload-artifact@v4
      with:
        name: libnative-lib
        path: libs/arm64-v8a/libnative-lib.so
